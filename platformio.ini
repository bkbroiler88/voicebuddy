; Voice Buddy -- inside-voice coach for the LCDWIKI ES3C28P
; (black ESP32-S3 2.8" ILI9341 "CYD", FT6336G cap touch, ES8311 codec + onboard mic,
;  WS2812B on IO42, 16MB flash, OPI PSRAM)
;
; Build:        pio run
; Flash:        pio run -t erase && pio run -t upload
; Monitor:      pio device monitor

[platformio]
default_envs = es3c28p

[env:es3c28p]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB

monitor_speed = 115200

extra_scripts = pre:tools/embed_web.py

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bblanchon/ArduinoJson @ ^7.2.1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- TFT_eSPI (S3 CYD panel) ----
    -DUSER_SETUP_LOADED=1
    -DUSE_FSPI_PORT=1
    -DILI9341_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
